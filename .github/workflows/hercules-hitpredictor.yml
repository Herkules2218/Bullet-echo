name: Build Hercules Hit Predictor APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'HitPredictor/**'
      - '.github/workflows/hercules-hitpredictor.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: HitPredictor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hercules-HitPredictor-debug-APK
          path: HitPredictor/app/build/outputs/apk/debug/app-debug.apk
